name: tests

# DeviceGuard is Windows-only (PyQt6 + pywin32 + wmi + ctypes.windll) and
# pinned to Python 3.13 (yara-python has no cp314 wheels). CI mirrors that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Qt runs headless via QT_QPA_PLATFORM=offscreen (set in tests/conftest.py).
        run: python -m pytest
